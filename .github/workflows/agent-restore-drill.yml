name: A5 restore drill

on:
  schedule:
    - cron: '0 06 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run restore drill (latest R2 backup -> ephemeral DB)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DRILL_DATABASE_URL: ${{ secrets.DRILL_DATABASE_URL }}
        run: npx tsx scripts/restore-drill.mjs
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('RESTORE DRILL FALLO: el ultimo backup no es restaurable o esta desactualizado. Revisar antes del cierre del mes.');