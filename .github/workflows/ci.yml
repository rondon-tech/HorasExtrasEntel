name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (frontend + backend)
        run: |
          npx tsc -b
          npx tsc -p tsconfig.backend.json --noEmit

      - name: Test
        run: npm test

      - name: Audit dependencies (fail on high)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Verify migration scripts exist
        run: |
          test -f server/migrations/001_initial-schema.js
          test -f migrate.mjs

  agent-evals:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Boot server + single login for evals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          npm run migrate
          nohup npm run server > server.log 2>&1 &
          npx wait-on http://localhost:3001/api/health --timeout 60000
          sleep 5
          TOKEN=$(curl -s -X POST http://localhost:3001/api/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASSWORD\"}" | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "LOGIN FAILED"; cat server.log; exit 1
          fi
          echo "AGENT_TEST_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Run promptfoo suite (A2 grounding / anti-hallucination / anti-injection)
        env:
          EVAL_BASE_URL: http://localhost:3001
        run: npm run eval:agents