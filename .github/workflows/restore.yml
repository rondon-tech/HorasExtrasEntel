name: Restore Database from R2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target database'
        type: choice
        default: 'fallback'
        options:
          - fallback
          - primary
        required: true

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore to fallback
        if: inputs.environment == 'fallback'
        run: node scripts/restore.mjs
        env:
          DATABASE_URL_FALLBACK: ${{ secrets.DATABASE_URL_FALLBACK }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Restore to primary (DANGER ZONE)
        if: inputs.environment == 'primary'
        run: |
          echo "⚠️  RESTORING TO PRIMARY DATABASE"
          DATABASE_URL_FALLBACK="${{ secrets.DATABASE_URL }}" node scripts/restore.mjs
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
