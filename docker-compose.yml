version: "3.9"

services:
  # PostgreSQL for local development (Neon.tech in production)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: entel
      POSTGRES_PASSWORD: entel_dev
      POSTGRES_DB: horas_extras
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entel -d horas_extras"]
      interval: 5s
      retries: 5

  # Backend Express API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://entel:entel_dev@db:5432/horas_extras
      JWT_SECRET: "${JWT_SECRET:-dev-secret-for-local-only}"
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 10s
      retries: 3

volumes:
  pgdata:
